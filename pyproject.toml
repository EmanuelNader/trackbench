[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trackbench"
version = "0.1.0"
description = "TrackBench — classical MOT research bench on nuScenes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pyquaternion>=0.9.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
nuscenes = ["nuscenes-devkit>=1.1.9,<2"]

[tool.setuptools.packages.find]
include = ["ingest*", "eval*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
