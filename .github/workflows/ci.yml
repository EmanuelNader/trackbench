name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libeigen3-dev
      - name: Configure & build
        run: |
          cmake -S core -B core/build -DCMAKE_BUILD_TYPE=Release -DTRACKBENCH_BUILD_TESTS=ON
          cmake --build core/build -j$(nproc)
      - name: Test
        run: cd core/build && ctest --output-on-failure
      - name: Determinism smoke
        run: |
          ./core/build/trackbench_run \
            --dets data/fixtures/synthetic_scene_001/detections.jsonl \
            --config core/config/default.json \
            --out /tmp/tracks_a.jsonl \
            --timing /tmp/timing_a.json
          ./core/build/trackbench_run \
            --dets data/fixtures/synthetic_scene_001/detections.jsonl \
            --config core/config/default.json \
            --out /tmp/tracks_b.jsonl \
            --timing /tmp/timing_b.json
          diff -u /tmp/tracks_a.jsonl /tmp/tracks_b.jsonl

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install light deps
        run: pip install numpy pyquaternion pytest python-dotenv
      - name: Pytest
        run: pytest tests/ -q

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trackbench
          POSTGRES_PASSWORD: trackbench
          POSTGRES_DB: trackbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackbench -d trackbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://trackbench:trackbench@localhost:5432/trackbench?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & migrate
        working-directory: api
        run: |
          npm ci
          npx prisma migrate deploy
          npx prisma generate
          npm run build
      - name: Health check
        working-directory: api
        run: |
          node dist/index.js &
          sleep 2
          curl -sf http://localhost:3001/health | grep -q '"ok":true'
