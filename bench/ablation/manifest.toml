# bench/ablation/manifest.toml — Phase 4 ablation grid on real nuScenes mini
#
# One command reproduces the whole grid:  python scripts/ablate.py
# Configs are declared here, never hardcoded in scripts. Each cell writes
# isolated outputs under bench/ablation/out/<cell>/.
#
# ── Reproducibility conditions ─────────────────────────────────────────────
# split               = nuScenes v1.0-mini (10 scenes under data/normalized/)
# detections          = Megvii train ∪ val merged
#                       data/raw/detections/megvii_mini_merged.json
#                       (verified: every normalized detection is explained by
#                        the merged file — 9561/9561; 5319 would be missing if
#                        val-only had been the source)
# tracking classes    = 7: bicycle, bus, car, motorcycle, pedestrian, trailer,
#                       truck
# ingest score filter = >= 0.3 (DEFAULT_MIN_DET_SCORE, ingest/nuscenes_ingest.py)
# NORMALIZED_ROOT     = data/normalized
# tracker build       = Release (TRACKBENCH_STAGE_TIMING=OFF, -O3)
# seed                = 0, constant across all cells
# python              = 3.9.6 (eval stack pinned in requirements.lock:
#                       numpy==1.26.4)
#
# NOTE: this file currently records the header + meta only. The 24-cell grid,
# named reference cells (baseline / post001 / post002 / post003), and expected
# landmarks (890 / 618 / 619 / 415) are added by the plan's Task 2.

[meta]
split = "nuScenes v1.0-mini"
detections_file = "data/raw/detections/megvii_mini_merged.json"
detections_source = "Megvii train ∪ val merged"
tracking_classes = 7
tracking_classes_list = ["bicycle", "bus", "car", "motorcycle", "pedestrian", "trailer", "truck"]
ingest_score_filter = 0.3
normalized_root = "data/normalized"
tracker_build_flavor = "Release"
tracker_build_stage_timing = "OFF"
tracker_build_opt = "-O3"
seed = 0
python_version = "3.9.6"
eval_stack = "requirements.lock"
eval_stack_pins = ["numpy==1.26.4"]

[meta.status]
grid_cells = "added by the plan's Task 2"
