services:
  postgres:
    image: postgres:16-alpine
    container_name: trackbench-postgres
    environment:
      POSTGRES_USER: trackbench
      POSTGRES_PASSWORD: trackbench
      POSTGRES_DB: trackbench
    ports:
      - "5432:5432"
    volumes:
      - trackbench_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackbench -d trackbench"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trackbench_pg:
